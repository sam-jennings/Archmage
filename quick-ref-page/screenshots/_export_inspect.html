<!DOCTYPE html><html><head>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head><body>
<pre id="out" style="white-space:pre-wrap;font-size:11px;color:#eee;background:#111"></pre>
<script>
window.addEventListener('load', () => {
  const src = 'function Foo(){ return 42; }\nwindow.Foo = Foo;\nexport { Foo };\n';
  const out = Babel.transform(src, { presets: ['react'] });
  document.getElementById('out').textContent = out.code;
});
</script>
</body></html>
