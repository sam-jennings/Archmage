<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Palette — Surface" subtitle="Page, hairlines, text, gold accent" viewport="700x260" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:var(--page-bg);}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  .group{display:flex;flex-direction:column;gap:6px;}
  .label{font-family:var(--font-display);font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--page-dim-deeper);margin-bottom:4px;}
  .row{display:flex;align-items:center;gap:10px;}
  .sw{width:38px;height:26px;border-radius:3px;border:1px solid rgba(255,255,255,.05);}
  .meta{font-family:var(--font-body);font-size:12px;color:var(--page-dim);}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--page-dim-deeper);}
</style></head>
<body>
<div class="grid">
  <div class="group">
    <span class="label">Surface</span>
    <div class="row"><div class="sw" style="background:#0a0810"></div><span class="meta">page-bg</span><span class="hex">#0a0810</span></div>
    <div class="row"><div class="sw" style="background:#120a1c"></div><span class="meta">page-bg-elev</span><span class="hex">#120a1c</span></div>
    <div class="row"><div class="sw" style="background:#2a1e48"></div><span class="meta">hairline</span><span class="hex">#2a1e48</span></div>
    <div class="row"><div class="sw" style="background:#180e2a"></div><span class="meta">hairline-soft</span><span class="hex">#180e2a</span></div>
  </div>
  <div class="group">
    <span class="label">Text</span>
    <div class="row"><div class="sw" style="background:#d8cdb8"></div><span class="meta">text (parchment)</span><span class="hex">#d8cdb8</span></div>
    <div class="row"><div class="sw" style="background:#a898b8"></div><span class="meta">text-soft</span><span class="hex">#a898b8</span></div>
    <div class="row"><div class="sw" style="background:#5a4878"></div><span class="meta">dim</span><span class="hex">#5a4878</span></div>
    <div class="row"><div class="sw" style="background:#4a3868"></div><span class="meta">dim-deeper</span><span class="hex">#4a3868</span></div>
    <div class="row"><div class="sw" style="background:#c8a84a"></div><span class="meta">gold accent</span><span class="hex">#c8a84a</span></div>
  </div>
</div>
</body></html>
