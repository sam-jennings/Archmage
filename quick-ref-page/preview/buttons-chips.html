<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Buttons & Chips" subtitle="Primary / secondary / ghost · suit chips" viewport="700x180" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:22px;background:var(--page-bg);display:flex;flex-direction:column;gap:16px;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:10px 18px;border-radius:4px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;}
.btn.primary{background:linear-gradient(180deg,#b89028,#8a6810);color:#0a0810;border-color:#e0b848;}
.btn.ghost{border-color:#4a3868;color:#a898b8;}
.chip{font-family:var(--font-display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:5px 10px;border-radius:3px;border:1px solid;}
.chip.rad{color:#f5c518;border-color:rgba(245,197,24,.4);background:rgba(245,197,24,.08);}
.chip.voi{color:#c060f0;border-color:rgba(192,96,240,.4);background:rgba(192,96,240,.08);}
.chip.flx{color:#00c8b4;border-color:rgba(0,200,180,.4);background:rgba(0,200,180,.08);}
.chip.aet{color:#e8304a;border-color:rgba(232,48,74,.4);background:rgba(232,48,74,.08);}
.lbl{font-family:var(--font-display);font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--page-dim-deeper);width:100px;}
</style></head><body>
<div class="row"><span class="lbl">Buttons</span>
<button class="btn primary">Cast Spell</button>
<button class="btn">Declare</button>
<button class="btn ghost">Cancel</button>
</div>
<div class="row"><span class="lbl">Suit chips</span>
<span class="chip rad">Radiance</span>
<span class="chip voi">Void</span>
<span class="chip flx">Flux</span>
<span class="chip aet">Aether</span>
</div>
</body></html>
