<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Wild Card · Connector Variants" subtitle="Moonstone strip across all 5 connectors — subtle, masked at top/bottom" viewport="700x260" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="../lib/cards.js"></script>
<style>
  body{padding:20px;background:var(--page-bg);}
  .row{display:flex;gap:10px;justify-content:center;align-items:flex-end;}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .cage{transform:scale(.5);transform-origin:top center;width:126px;height:176px;}
  .lbl{font-family:var(--font-display);font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--page-dim);}
</style></head><body><div class="row" id="row"></div>
<script>
const variants=['bloom','parallelogram','triangle','notch','beacon'];
const row=document.getElementById('row');
variants.forEach(v=>{
  const col=document.createElement('div');col.className='col';
  const cage=document.createElement('div');cage.className='cage';
  cage.innerHTML=ArchmageCards.makeWildCard({connector:v,scale:1});
  const lbl=document.createElement('span');lbl.className='lbl';lbl.textContent=v;
  col.appendChild(cage);col.appendChild(lbl);row.appendChild(col);
});
</script></body></html>
