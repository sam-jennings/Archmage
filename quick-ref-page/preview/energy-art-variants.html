<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Energy Art Variants" subtitle="Sigil · runic · crystalline — each in all four suits" viewport="700x220" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="../lib/cards.js"></script>
<style>body{padding:12px;background:var(--page-bg);}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.row{display:flex;gap:10px;}
.lbl{font-family:var(--font-display);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--page-dim);}
.grp{display:flex;gap:4px;}.cage{transform:scale(.35);transform-origin:top left;width:88px;height:124px;}
</style></head><body><div class="row" id="row"></div>
<script>
const row=document.getElementById('row');
['sigil','runic','crystalline'].forEach(a=>{const col=document.createElement('div');col.className='col';const grp=document.createElement('div');grp.className='grp';['radiance','void','flux','aether'].forEach(s=>{const c=document.createElement('div');c.className='cage';c.innerHTML=ArchmageCards.makeCard(7,s,{art:a,scale:1});grp.appendChild(c);});const lbl=document.createElement('span');lbl.className='lbl';lbl.textContent=a;col.appendChild(grp);col.appendChild(lbl);row.appendChild(col);});
</script></body></html>
