<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Palette — Suits" subtitle="Four elemental suits + Convergence · three-stop scales" viewport="700x210" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:var(--page-bg);}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .col{display:flex;flex-direction:column;gap:4px;}
  .name{font-family:var(--font-display);font-size:10px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:4px;}
  .row{display:flex;align-items:center;gap:8px;}
  .sw{width:40px;height:28px;border-radius:3px;border:1px solid rgba(255,255,255,.04);}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--page-dim);}
</style></head>
<body>
<div class="grid">
  <div class="col"><span class="name" style="color:#c8961a">Radiance</span>
    <div class="row"><div class="sw" style="background:#f5c518"></div><span class="hex">#f5c518 · bright</span></div>
    <div class="row"><div class="sw" style="background:#c8961a"></div><span class="hex">#c8961a · mid</span></div>
    <div class="row"><div class="sw" style="background:#3a2800"></div><span class="hex">#3a2800 · dim</span></div>
  </div>
  <div class="col"><span class="name" style="color:#9040c8">Void</span>
    <div class="row"><div class="sw" style="background:#c060f0"></div><span class="hex">#c060f0 · bright</span></div>
    <div class="row"><div class="sw" style="background:#6a0dad"></div><span class="hex">#6a0dad · mid</span></div>
    <div class="row"><div class="sw" style="background:#200840"></div><span class="hex">#200840 · dim</span></div>
  </div>
  <div class="col"><span class="name" style="color:#00a898">Flux</span>
    <div class="row"><div class="sw" style="background:#00c8b4"></div><span class="hex">#00c8b4 · bright</span></div>
    <div class="row"><div class="sw" style="background:#008878"></div><span class="hex">#008878 · mid</span></div>
    <div class="row"><div class="sw" style="background:#002820"></div><span class="hex">#002820 · dim</span></div>
  </div>
  <div class="col"><span class="name" style="color:#c8203a">Aether</span>
    <div class="row"><div class="sw" style="background:#e8304a"></div><span class="hex">#e8304a · bright</span></div>
    <div class="row"><div class="sw" style="background:#c8203a"></div><span class="hex">#c8203a · mid</span></div>
    <div class="row"><div class="sw" style="background:#400010"></div><span class="hex">#400010 · dim</span></div>
  </div>
  <div class="col"><span class="name" style="color:#a8b8e0">Convergence</span>
    <div class="row"><div class="sw" style="background:#c8d8f8"></div><span class="hex">#c8d8f8 · bright</span></div>
    <div class="row"><div class="sw" style="background:#7080b8"></div><span class="hex">#7080b8 · mid</span></div>
    <div class="row"><div class="sw" style="background:#101828"></div><span class="hex">#101828 · dim</span></div>
  </div>
</div>
</body></html>
