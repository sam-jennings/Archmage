<!DOCTYPE html>

<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="../lib/cards.js"></script>
<style>body{padding:20px;background:var(--page-bg);display:flex;gap:24px;align-items:center;}

<div id="card"></div>
