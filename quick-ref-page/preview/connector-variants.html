<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Connector Variants" subtitle="Bloom · parallelogram · triangle · notch · beacon" viewport="700x200" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="../lib/cards.js"></script>
<style>body{padding:14px 10px;background:var(--page-bg);}
.row{display:flex;gap:8px;justify-content:center;align-items:flex-start;}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;}
.lbl{font-family:var(--font-display);font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--page-dim);}
.cage{transform:scale(.42);transform-origin:top center;width:106px;height:150px;}
</style></head><body><div class="row" id="row"></div>
<script>
const variants=['bloom','parallelogram','triangle','notch','beacon'];
const row=document.getElementById('row');
variants.forEach(v=>{const col=document.createElement('div');col.className='col';const cage=document.createElement('div');cage.className='cage';cage.innerHTML=ArchmageCards.makeCard(7,'radiance',{connector:v,scale:1});const lbl=document.createElement('span');lbl.className='lbl';lbl.textContent=v;col.appendChild(cage);col.appendChild(lbl);row.appendChild(col);});
</script></body></html>
