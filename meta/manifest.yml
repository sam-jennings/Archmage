# Declared project layout. check.mjs verifies the actual tree against this file.
# Update this IN THE SAME ACTION as creating/moving/deleting files (process.md §5).
# Format: constrained YAML — top-level keys, "  - item" lists, "  key: value" maps.

root_files:
  - PROJECT.md
  - USING_THE_SYSTEM.md
  - index.html
  - Playtest Guide - New Player Session.md
  - .gitattributes
  - .gitignore

folders:
  - meta/
  - playtests/
  - rulebook/
  - board/
  - card-design/
  - art/
  - web-apps/
  - simulation/
  - ascension-trials/
  - tests/
  - tools/
  - skills/
  - course-knowledge/
  - expansion/
  - pitch/
  - _review/
  - _archive/
  - outputs/
  - .kiro/
  - .github/
  - .obsidian/
  - .vscode/
  - .venv/
  - .codex-viewport-check/

# Filename patterns enforced inside specific folders (JS regex, applied to filenames)
patterns:
  playtests/: ^(\d{4}-\d{2}-\d{2}-session-\d+\.md|\.gitkeep)$
  skills/: \.skill$
  meta/decisions/: ^\d{4}-\d{2}-\d{2}-[a-z0-9-]+\.md$
  meta/threads/: ^[a-z0-9-]+\.md$

# Single sources of truth — edit these, never create parallel copies
sources_of_truth:
  rules: rulebook/Archmage Ascension - Complete Rulebook.md
  glossary: rulebook/GLOSSARY.md
  scoring: rulebook/Scoring System Reference.md
  lore: rulebook/Story.md
  visual-system: card-design/VISUAL_SYSTEM.md
  card-renderer: card-design/playtable.html
  process: meta/process.md
  canon: meta/canon.yml
  pitch: pitch/archmage_pitch_sheet.html

# Folder purposes (for orientation; not machine-checked)
purposes:
  meta/: all process state — agent-written, script-checked
  playtests/: one detail file per session; front-matter goal/verdict is the index
  rulebook/: rules, glossary, scoring, trials variant, lore
  board/: physical components — A3 board PDF, printable reference cards
  card-design/: card visuals — renderer, procedural art (arcana), connector (beacon), exports
  art/: raw offline art library; not referenced by the live renderer
  web-apps/: player-facing tools + React/Vite 2-player digital build
  simulation/: Python deck/economy rig with ASSUMPTIONS/RESULTS
  ascension-trials/: everything Ascension Trials — the advanced endgame variant. Consolidated 2026-07-13 (was split across simulation/ and _review/); rulebook/Ascension Trials.md (rules) and .kiro/specs/ascension-trials-* (Kiro specs) stay in their own conventional homes, referenced not copied.
  ascension-trials/ascension_trials_model/: Ascension Trials analysis package — approved layout is pyproject.toml, requirements.lock, src/ascension_trials, tests, configs, fixtures, docs, README (outputs generated and gitignored); canonical spec in .kiro/specs/ascension-trials-configuration-model; docs/ holds the current normative model + Kiro-implementation-spec snapshots + VS1-3 completion reports
  ascension-trials/design-history/: proposals, critiques, audits, selection plans and shortlists (the numbered ASCENSION_TRIALS_01..08 docs, formerly in _review/) — moved here since they're a dedicated, ongoing design trail, not generic pending-decision material
  tests/: property-based tests (hand-checker)
  tools/: designer-only analysis tools — never player-facing
  skills/: .skill packages (Cowork adapter + domain skills)
  course-knowledge/: read-only course material
  expansion/: expansion concepts at various stages (gate lifted 2026-07-16; only Ascension Trials confirmed, no settled sequencing); index EXPANSION_INDEX.md is the map
  expansion/spell-duels/: canonical Reconciled & Tiered ruleset; source/ holds the three notes files it reconciles
  expansion/schools-and-last-rites/: v0.1 rulesets (most-developed pair) + playtest-plan templates
  expansion/future-directions/: Post-Echo Exploration candidate directions (not yet chosen)
  expansion/rituals-and-seals/: Rituals & Mastery Seals v0.1 (earned-identity module, salvaged from old thread 2026-07-16)
  expansion/null-cabal/: The Null Cabal v0.1 (hidden traitor 3-6p, salvaged from old thread 2026-07-16)
  expansion/foci-and-conduits/: Foci & Conduits v0.1 (engine-builder module — unique spell attachments + chaining, 2026-07-16)
  expansion/the-schism/: The Schism v0.1 (dedicated 2-player box — cut-and-choose Rift market with Tithe, first count-gated module, 2026-07-17)
  expansion/solo-attuned-rival/: Solo Mode — The Attuned Rival v0.1 (base-box automa, rules brain, second count-gated module — 1p, 2026-07-19)
  _review/: items awaiting a decision; each must be referenced in meta/QUEUE.md
  _archive/: superseded material, gitignored, only grows
  outputs/: generated artifacts, gitignored
  .codex-viewport-check/: viewport-test scratch; candidate for archiving
