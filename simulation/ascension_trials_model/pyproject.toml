[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascension-trials-model"
version = "0.1.0"
description = "Deterministic analysis model for Ascension Trials configurations (Archmage Ascension)."
requires-python = ">=3.12"
# VS1 (resolver + fixtures) is intentionally pure-stdlib: integer + fractions.Fraction math.
# No third-party runtime dependency is needed to load configs, derive states or resolve profiles.
dependencies = []

[project.optional-dependencies]
# VS2 equilibrium laboratory: zero-sum LP + maximum-entropy selection.
# Pinned in requirements.lock; install before starting VS2 (see README).
# scipy 1.16.0 supports Python 3.11-3.13 and NumPy >= 1.25; numpy 2.3.3 is the
# version verified importable in the development environment (Python 3.13).
equilibrium = [
    "numpy==2.3.3",
    "scipy==1.16.0",
]
test = [
    "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Run the suite straight from src/ without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
